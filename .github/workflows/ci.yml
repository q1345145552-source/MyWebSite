name: CI - Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          # ⚠️ 前端也必须用 npm ci（2026-08-28 改）。
          # 原来是 npm install：它会自行解析出比锁文件更新的小版本，还会顺手改写
          # package-lock.json —— 于是「锁文件和 package.json 对不上」这类问题在 CI 里
          # 被悄悄抹平，等到 Dockerfile.web 的 npm ci 才炸，而那时已经在部署流程里了。
          # 用 npm ci 才和镜像里装的是同一份。
          npm ci --prefix apps/web

      # 后端类型检查要用 Prisma 生成出来的类型。
      # CI 装依赖用的是 `npm ci --ignore-scripts`，不会自动生成，必须显式跑一次，
      # 否则后端检查会报一堆「@prisma/client 没有导出 PrismaClient」（实测过）。
      - name: Generate Prisma client
        run: npm run db:generate

      # 后端类型检查（2026-08-27 加）。
      # 以前 CI 只查前端，后端一路带着十几个报错也能合并、也能部署 ——
      # 真出问题时全被淹在噪音里。2026-08-27 把后端清到 0 个错，从此不许再退回去。
      - name: TypeScript check (backend)
        run: npx -p typescript tsc --noEmit --project apps/api/tsconfig.json

      - name: TypeScript check (frontend)
        run: npx -p typescript tsc --noEmit --project apps/web/tsconfig.json

      # 自测脚本的类型检查（2026-08-28 加）。
      # 以前 scripts/ 不在任何 tsconfig 里，等于从来没查过 ——
      # test-ai-answer-numbers.ts 里有个早就不存在的 Order 类型，
      # 因为类型会被擦除所以脚本照跑不误，一直没人发现（复核时才抓到）。
      - name: TypeScript check (test scripts)
        run: npx -p typescript tsc --noEmit --project tsconfig.scripts.json

      # 批量下单解析的自测（2026-08-28 接进 CI）。
      # 这个脚本会跑 100 张单 / 300 行明细，覆盖多产品合并、公共字段继承、
      # 方数与重量汇总、以及十几种填错的拦截。以前只能手动跑，容易忘。
      - name: Test batch order parser
        run: npm run test:batch-import

      # 整柜拆柜派送清单导出（2026-08-28 加）。
      # 老板实测「多尺寸的单子长宽高三格全空白」，而这个模块一个测试都没有。
      # 一票货里有多个不同尺寸时，后端给的是「60/50」这种字符串，
      # 前端原来只认数字、字符串一律丢掉 —— 五项里第 2 项就是盯这个的。
      - name: Test lastmile dispatch export
        run: npm run test:lastmile-export

      # 普通版集货「还能不能删」那把尺子（2026-08-28 加）。
      # 「删整张预报单」原来一道检查都没有：已付款也照删、级联把货物明细一起删光、
      # 钱一分不退，而且货删完之后「撤销付款」会 400，退款的口子也跟着封死。
      - name: Test consolidation delete guard
        run: npm run test:consolidation-delete

      # AI 答复的数字校验（2026-08-28 加）。
      # 覆盖三件事：模型润色时改了数字要被拦下、「今天/本月」按北京时间算、
      # 时间窗按下单时间而不是最后更新时间。
      # ⚠️ 故意跑两个时区：生产容器是 UTC、开发机在中国是 UTC+8，
      # 时区那条 bug 只在 UTC 下暴露 —— 这就是它反复"本地测没问题、线上还是错"的原因。
      - name: Test AI answer numbers
        run: npm run test:ai-numbers

      # AI 聊天接口的限流与长度校验（2026-08-28 加）。
      # 这个接口每条消息固定调两次 DeepSeek，是全系统唯一直接花钱的地方。
      # 脚本只跑「被拦下」的路径，全程不连数据库、不调 DeepSeek。
      - name: Test AI chat limits
        run: npm run test:ai-limits

      # DeepSeek 调用超时（2026-08-28 加）。
      # 在本机起一个「只收不回」的假服务器冒充 DeepSeek，验证客户端会自己断开。
      # 不连真的 DeepSeek、不花钱。
      - name: Test DeepSeek timeout
        run: npm run test:ai-timeout

      - name: Build frontend
        run: npm run build --prefix apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
